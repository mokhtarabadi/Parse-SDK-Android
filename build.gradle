buildscript {
    ext.kotlin_version = "1.9.22"
    ext.jacocoVersion = '0.8.12'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jacoco:org.jacoco.core:$jacocoVersion"
        classpath "com.dicedmelon.gradle:jacoco-android:0.1.5"
        classpath "io.freefair.gradle:android-gradle-plugins:8.13.0"
        classpath "com.diffplug.spotless:spotless-plugin-gradle:6.25.0"
    }
}

plugins {
    id "com.github.ben-manes.versions" version "0.51.0"
    id "com.diffplug.spotless" version "6.25.0"
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    apply plugin: "com.diffplug.spotless"

    spotless {
        java {
            target '**/*.java'
            googleJavaFormat().aosp()
            removeUnusedImports()
            trimTrailingWhitespace()
            indentWithSpaces()
            endWithNewline()
        }
        kotlin {
            target '**/*.kt'
            ktlint().editorConfigOverride(["disabled_rules": "no-wildcard-imports"])
            trimTrailingWhitespace()
            indentWithSpaces()
            endWithNewline()
        }
        format 'misc', {
            target '**/*.gradle', '**/*.md', '**/.gitignore'
            // Machine-managed dirs: task files carry injected git diffs, context-reports carry
            // graph output — the formatter must not rewrite them (would churn on every stage).
            targetExclude 'tasks/**', 'context-reports/**'
            indentWithSpaces()
            trimTrailingWhitespace()
            endWithNewline()
        }

        format 'xml', {
            target '**/*.xml'
            indentWithSpaces()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }
}

ext {
    compileSdkVersion = 36

    minSdkVersion = 23
    targetSdkVersion = 35

    mockitoCoreVersion = '4.11.0'
    junitVersion = "4.13.2"
    jupiterVersion = "5.6.0"
    robolectricVersion = "4.14.1"
}

// Central Portal signing (release CI only): runs after all projects are evaluated so every
// publication exists, and activates ONLY when SIGNING_KEY/SIGNING_PASSWORD are set. Local,
// JitPack, and R2 builds never set them, so this stays inert there.
gradle.projectsEvaluated {
    gradle.rootProject.allprojects { p ->
        if (System.getenv("SIGNING_KEY") && System.getenv("SIGNING_PASSWORD")) {
            p.pluginManager.apply("signing")
            def signingExt = p.extensions.getByName("signing")
            signingExt.useInMemoryPgpKeys(System.getenv("SIGNING_KEY"), System.getenv("SIGNING_PASSWORD"))
            def publishingExt = p.extensions.findByName("publishing")
            if (publishingExt != null) {
                signingExt.sign(publishingExt.publications)
            }
        }
    }
}
