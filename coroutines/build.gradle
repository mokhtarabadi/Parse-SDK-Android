apply plugin: "com.android.library"
apply plugin: "maven-publish"

group = findProperty("centralGroup") ?: "com.github.mokhtarabadi.Parse-SDK-Android"

android {
    compileSdk rootProject.ext.compileSdkVersion
    namespace "com.parse.coroutines"

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
    }

    buildFeatures {
        buildConfig true
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }

    buildTypes {
        debug {
            buildConfigField("String","PARSE_VERSION","\"${version}\"")
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            buildConfigField("String","PARSE_VERSION","\"${version}\"")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

ext {
    coroutinesVersion = "1.6.1"
}

dependencies {
    api "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22"
    api "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutinesVersion"
    api "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesVersion"
    implementation project(":parse")

    testImplementation "junit:junit:$rootProject.ext.junitVersion"
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components["release"]
                artifactId = "coroutines"
                pom {
                                name = "Parse-SDK-Android ${project.name}"
                                description = "Parse SDK for Android"
                                url = "https://github.com/mokhtarabadi/Parse-SDK-Android"
                                licenses {
                                    license {
                                        name = "BSD License"
                                        url = "https://github.com/mokhtarabadi/Parse-SDK-Android/blob/master/LICENSE"
                                    }
                                }
                                developers {
                                    developer {
                                        id = "mokhtarabadi"
                                        name = "Mohammad Reza Mokhtarabadi"
                                    }
                                }
                                scm {
                                    connection = "scm:git:git://github.com/mokhtarabadi/Parse-SDK-Android.git"
                                    developerConnection = "scm:git:ssh://github.com/mokhtarabadi/Parse-SDK-Android.git"
                                    url = "https://github.com/mokhtarabadi/Parse-SDK-Android"
                                }
                            }
            }
        }
    }
}
