apply plugin: "com.android.library"
apply plugin: "maven-publish"

group = findProperty("centralGroup") ?: "com.github.mokhtarabadi.Parse-SDK-Android"

android {
    compileSdk rootProject.ext.compileSdkVersion
    namespace "com.parse.google"

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
    }

    buildFeatures {
        buildConfig true
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }

    lint {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug {
            enableAndroidTestCoverage = true
            enableUnitTestCoverage = true
            buildConfigField("String","PARSE_VERSION","\"${version}\"")
        }
        release {
            minifyEnabled false
            enableAndroidTestCoverage = false
            enableUnitTestCoverage = false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            buildConfigField("String","PARSE_VERSION","\"${version}\"")
        }
    }

}

dependencies {
    api "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    api "com.google.android.gms:play-services-auth:20.2.0"
    api "androidx.activity:activity-ktx:1.5.1"
    api "androidx.fragment:fragment-ktx:1.5.2"
    implementation project(":parse")
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components["release"]
                artifactId = "google"
                pom {
                                name = "Parse-SDK-Android ${project.name}"
                                description = "Parse SDK for Android"
                                url = "https://github.com/mokhtarabadi/Parse-SDK-Android"
                                licenses {
                                    license {
                                        name = "BSD License"
                                        url = "https://github.com/mokhtarabadi/Parse-SDK-Android/blob/master/LICENSE"
                                    }
                                }
                                developers {
                                    developer {
                                        id = "mokhtarabadi"
                                        name = "Mohammad Reza Mokhtarabadi"
                                    }
                                }
                                scm {
                                    connection = "scm:git:git://github.com/mokhtarabadi/Parse-SDK-Android.git"
                                    developerConnection = "scm:git:ssh://github.com/mokhtarabadi/Parse-SDK-Android.git"
                                    url = "https://github.com/mokhtarabadi/Parse-SDK-Android"
                                }
                            }
            }
        }
    }
}
